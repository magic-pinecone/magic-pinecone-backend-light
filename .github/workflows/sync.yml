name: Database Synchronization

on:
  schedule:
    # 台灣時間每天凌晨 04:00 執行一次 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 允許手動觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Course Sync
        run: |
          curl -X POST -f "${{ secrets.BACKEND_URL }}/course/sync?background=false"

      - name: Trigger Scholarship Sync
        run: |
          curl -X POST -f "${{ secrets.BACKEND_URL }}/scholarship/sync?background=false"
